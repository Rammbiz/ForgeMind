# Builds the Crystal Bastion Android APK (Godot 4.7, prebuilt templates, no Gradle).
#
# - Every push touching the game (or this file) and manual runs: debug APK artifact
#   "crystal-bastion-debug-apk".
# - If the repository secrets ANDROID_KEYSTORE_BASE64 (base64 of the .jks/.keystore),
#   ANDROID_KEYSTORE_PASSWORD (store password == key password) and ANDROID_KEY_ALIAS are
#   set: also a signed release APK artifact "crystal-bastion-release-apk".
# - Tags v* (version-like, e.g. v1.2.0): version/name is taken from the tag, version/code from
#   the run number, and the APKs are attached to the GitHub Release for that tag.
#
# The heavy lifting is crystal-bastion/tools/build_android.sh, the same script used locally.
name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "crystal-bastion/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Export APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (preinstalled on the runner)
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk" ] || [ ! -d "$sdk" ]; then
            echo "::error::No Android SDK found on the runner (ANDROID_SDK_ROOT/ANDROID_HOME)"
            exit 1
          fi
          if ! compgen -G "$sdk/build-tools/*/apksigner" > /dev/null || [ ! -x "$sdk/platform-tools/adb" ]; then
            sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            yes | "$sdkmanager" --licenses > /dev/null || true
            "$sdkmanager" "platform-tools" "build-tools;36.0.0"
          fi
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          ls "$sdk/build-tools"

      - name: Cache Godot editor + Android export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot-ci
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-linux-android-v1

      - name: Download Godot ${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          dest="$HOME/.cache/godot-ci"
          mkdir -p "$dest/templates"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$base/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          unzip -o -q "$RUNNER_TEMP/godot.zip" -d "$dest"
          mv "$dest/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" "$dest/godot"
          chmod +x "$dest/godot"
          # The .tpz holds every platform (~1.3 GB); only the Android templates are kept/cached.
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/templates.tpz" "$base/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          unzip -o -q -j "$RUNNER_TEMP/templates.tpz" \
            templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$dest/templates"
          rm -f "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/templates.tpz"

      - name: Install Godot + export templates
        run: |
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$tdir"
          cp "$HOME/.cache/godot-ci/templates/"* "$tdir/"
          echo "GODOT=$HOME/.cache/godot-ci/godot" >> "$GITHUB_ENV"
          "$HOME/.cache/godot-ci/godot" --version
          cat "$tdir/version.txt"

      - name: Cache debug keystore (stable debug signature between runs)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Debug keystore
        run: |
          ks="$HOME/.android/debug.keystore"
          if [ ! -f "$ks" ]; then
            mkdir -p "$(dirname "$ks")"
            keytool -genkeypair -keystore "$ks" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$ks"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="${GITHUB_REF_NAME#v}"
          # The name goes into a sed replacement and a quoted cfg value: only allow version-like
          # tags (v1.2.3, v1.2.3-beta.1, v1.2.3+4) so '&', '|', '"' or '\' cannot corrupt it.
          if [[ ! "$name" =~ ^[0-9][0-9A-Za-z.+_-]*$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a version tag (expected e.g. v1.2.3)"
            exit 1
          fi
          sed -i -e "s|^version/name=.*|version/name=\"${name}\"|" \
                 -e "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" crystal-bastion/export_presets.cfg
          grep '^version/' crystal-bastion/export_presets.cfg

      - name: Import + export debug APK
        run: crystal-bastion/tools/build_android.sh debug "$GITHUB_WORKSPACE/dist/crystal-bastion-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crystal-bastion-debug-apk
          path: dist/crystal-bastion-debug.apk
          if-no-files-found: error
          compression-level: 0

      - name: Export signed release APK
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$ks"
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$ks" \
            crystal-bastion/tools/build_android.sh release "$GITHUB_WORKSPACE/dist/crystal-bastion-release.apk"

      - name: Upload release APK
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crystal-bastion-release-apk
          path: dist/crystal-bastion-release.apk
          if-no-files-found: error
          compression-level: 0

  release:
    name: Attach APKs to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: crystal-bastion-*-apk
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk --repo "$GITHUB_REPOSITORY" \
              --title "Crystal Bastion ${GITHUB_REF_NAME}" --generate-notes
          fi
